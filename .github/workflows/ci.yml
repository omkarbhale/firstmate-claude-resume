name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq and shellcheck
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Lint
        run: ./lint.sh
      - name: Test
        run: ./tests/run.sh
